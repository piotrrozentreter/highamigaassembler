name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Confirm tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python -c 'from hasc import __version__; print(__version__)')"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: |
          cd "$RUNNER_TEMP"
          python -m build "$GITHUB_WORKSPACE" --outdir "$GITHUB_WORKSPACE/dist"
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test installed wheel
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install dist/*.whl
          .package-test/bin/hasc --version
          .package-test/bin/hasc examples/add.has -o /tmp/add.s
      - name: Run tests
        run: python -m pytest tests -q
      - name: Compile CPU smoke examples
        run: |
          python -m hasc.cli examples/add.has --cpu 68000 -o /tmp/add-68000.s
          python -m hasc.cli examples/add.has --cpu 68020 -o /tmp/add-68020.s
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes